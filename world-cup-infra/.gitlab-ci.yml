stages:
  - lint
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.9.0"
  AWS_REGION: us-east-1
  TF_ROOT: world-cup-infra/terraform

# Run on MRs, main branch pushes, and manual web triggers
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# Shared config: Terraform image + AWS OIDC auth
# GitLab OIDC trust policy must be added to the world-cup-dev role alongside GitHub's.
# Add this to the role's trust policy:
#   { "Federated": "arn:aws:iam::866934333672:oidc-provider/gitlab.com",
#     "Action": "sts:AssumeRoleWithWebIdentity",
#     "Condition": { "StringLike": {
#       "gitlab.com:sub": "project_path:Eniadebisi/*:ref_type:branch:ref:main" } } }
.terraform-base:
  image: hashicorp/terraform:1.9.0
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli curl jq
    - >
      eval $(aws sts assume-role-with-web-identity
      --role-arn "$INFRA_CI_ROLE_ARN"
      --role-session-name "gitlab-ci-$CI_JOB_ID"
      --web-identity-token "$AWS_OIDC_TOKEN"
      --duration-seconds 3600
      --query 'Credentials.{AKI:AccessKeyId,SAK:SecretAccessKey,ST:SessionToken}'
      --output text | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')
    - aws sts get-caller-identity

# ── Stage 1: Lint ────────────────────────────────────────────────────────────

fmt-check:
  stage: lint
  image: hashicorp/terraform:1.9.0
  script:
    - terraform fmt -check -recursive $TF_ROOT/modules
    - terraform fmt -check -recursive $TF_ROOT/global
    - terraform fmt -check -recursive $TF_ROOT/platform
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - world-cup-infra/terraform/**/*
        - .gitlab-ci.yml

helm-lint:
  stage: lint
  image: alpine/helm:3.14.0
  script:
    - helm lint world-cup-infra/helm/world-cup/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - world-cup-infra/helm/**/*

security-scan:
  stage: lint
  image: aquasec/trivy:latest
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 world-cup-infra/terraform/
    - trivy config --severity HIGH,CRITICAL --exit-code 1 world-cup-infra/helm/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Stage 2: Validate ────────────────────────────────────────────────────────

validate-global:
  extends: .terraform-base
  stage: validate
  script:
    - cd $TF_ROOT/global
    - terraform init -backend=false
    - terraform validate
  needs: [fmt-check]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate-platform:
  extends: .terraform-base
  stage: validate
  script:
    - cd $TF_ROOT/platform
    - terraform init -backend=false
    - terraform validate
  needs: [fmt-check]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ── Stage 3: Plan (MR only, posts output as MR note) ─────────────────────────

plan-global:
  extends: .terraform-base
  stage: plan
  script:
    - cd $TF_ROOT/global
    - terraform init
    - terraform plan -no-color 2>&1 | tee plan.txt; PLAN_EXIT=${PIPESTATUS[0]}
    - |
      PLAN_BODY=$(cat plan.txt | head -c 60000)
      STATUS=$( [ $PLAN_EXIT -eq 0 ] && echo "✅ success" || echo "❌ failed" )
      curl --silent --fail --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" \
        --data "$(jq -n --arg body "### $STATUS — Global stack plan
      \`\`\`terraform
      $PLAN_BODY
      \`\`\`" '{body: $body}')"
    - exit $PLAN_EXIT
  artifacts:
    paths: [world-cup-infra/terraform/global/plan.txt]
    expire_in: 1 day
  needs: [validate-global]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - world-cup-infra/terraform/**/*

plan-platform:
  extends: .terraform-base
  stage: plan
  script:
    - cd $TF_ROOT/platform
    - terraform init
    - terraform plan -no-color 2>&1 | tee plan.txt; PLAN_EXIT=${PIPESTATUS[0]}
    - |
      PLAN_BODY=$(cat plan.txt | head -c 60000)
      STATUS=$( [ $PLAN_EXIT -eq 0 ] && echo "✅ success" || echo "❌ failed" )
      curl --silent --fail --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        --header "Content-Type: application/json" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" \
        --data "$(jq -n --arg body "### $STATUS — Platform stack plan
      \`\`\`terraform
      $PLAN_BODY
      \`\`\`" '{body: $body}')"
    - exit $PLAN_EXIT
  artifacts:
    paths: [world-cup-infra/terraform/platform/plan.txt]
    expire_in: 1 day
  needs: [validate-platform]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - world-cup-infra/terraform/**/*

# ── Stage 4: Apply (main branch, manual gate) ────────────────────────────────

apply-global:
  extends: .terraform-base
  stage: apply
  script:
    - cd $TF_ROOT/global
    - terraform init
    - terraform plan -no-color -out=tfplan
    - terraform apply -auto-approve tfplan
    - terraform output
  environment:
    name: global
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

apply-platform:
  extends: .terraform-base
  stage: apply
  script:
    - cd $TF_ROOT/platform
    - terraform init
    - terraform plan -no-color -out=tfplan
    - terraform apply -auto-approve tfplan
    - terraform output
  environment:
    name: platform
  needs: [apply-global]
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
